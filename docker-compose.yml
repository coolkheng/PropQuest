version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    container_name: propquest-backend
    restart: unless-stopped
    networks:
      - propquest-network

  frontend:
    build:
      context: ./propquest
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_FRONTEND_ORIGIN=http://localhost:3000
      - NEXT_PUBLIC_ARCGIS_API_KEY=${NEXT_PUBLIC_ARCGIS_API_KEY}
    depends_on:
      - backend
    container_name: propquest-frontend
    restart: unless-stopped
    networks:
      - propquest-network

networks:
  propquest-network:
    driver: bridge
